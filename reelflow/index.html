<style>

@media (max-width:800px){.app{display:block}.sidebar{position:fixed;z-index:40;left:0;top:0;bottom:0;width:265px;transform:translateX(-102%);transition:transform .18s;box-shadow:10px 0 30px #13152625}.sidebar.mobile-open{transform:translateX(0)}.menu-overlay.active{display:block;position:fixed;inset:0;background:#12172b8c;z-index:39}.mobile-menu{display:inline-flex}.content{padding:16px}.topbar{padding:10px 16px;gap:8px}.topbar .crumb{display:none}.top-select{max-width:175px}.intro{align-items:flex-start}.cols2,.cols3{grid-template-columns:1fr}.hero{padding:22px;grid-template-columns:1fr}.hero-right{justify-content:flex-start}.hero-kpi{padding:10px 16px}.hero-kpi strong{font-size:28px}.pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px}.intro h1{font-size:24px}}

<script>
(()=>{'use strict';
const KEY='reelflow.studio.v1';
const stages=[['Идея','strategy'],['Цель и аудитория','strategy'],['Сценарий','script'],['Режиссёрская таблица','director'],['Список кадров','shots'],['B-roll','shots'],['План съёмки','shoot'],['Монтаж','edit'],['Публикация','publish'],['Разбор результата','publish']];
const navs=[['dashboard','Пульт','◫'],['strategy','Идея и стратегия','✧'],['script','Сценарий','≡'],['director','Режиссёрская таблица','▤'],['shots','Кадры и B-roll','▦'],['shoot','Съёмка по локациям','◎'],['edit','Монтажный план','⌁'],['publish','Публикация и разбор','↗'],['series','Контент-серия','⊞'],['templates','Шаблоны','◈']];
const now=()=>new Date().toISOString();
const id=()=>('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const txt=v=>String(v??'').trim();
const dateRu=v=>{try{return new Date(v).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}catch{return '—'}};
const newScene=()=>({id:id(),start:'00:00',end:'00:06',voice:'',visual:'',onScreen:'',location:'',audio:'',type:'Основной'});
const newShot=()=>({id:id(),description:'',location:'Дом / студия',size:'Крупный',equipment:'Телефон / камера',scene:'',notes:'',done:false});
const newBroll=()=>({id:id(),description:'',source:'Снять',location:'',notes:'',done:false});
const newEdit=()=>({id:id(),start:'00:00',end:'00:06',action:'',audio:'',subtitles:'',done:false});
function blankProject(){return {id:id(),title:'Новый ролик',series:'Без серии',seriesNumber:1,format:'faceless',length:45,platform:'VK Клипы',idea:'',raw:'',goal:'',audience:'',thesis:'',hook:'',script:'',cta:'',references:'',minAnimation:'Лёгкие появления, масштабирование и движение по ключевым точкам',illustrations:'',voice:'',music:'',musicMood:'',subtitlesFile:'',subtitlesNotes:'',subtitlesChecked:false,shootDate:'',shootNotes:'',gear:'Телефон / камера, петличка, штатив, свет',locationNotes:'',caption:'',hashtags:'',cover:'',publishDate:'',publishUrl:'',metrics:{views:'',reach:'',watch:'',retention:'',saves:'',shares:'',comments:'',clicks:''},takeaways:'',nextHypothesis:'',scenes:[],shots:[],broll:[],edits:[],stages:Array(10).fill(false),finished:false,createdAt:now(),updatedAt:now()}};
let storageAvailable=true;
let s={projects:[blankProject()],templates:[],currentId:null,view:'dashboard',shotTab:'shots'};
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(Array.isArray(data.projects)&&data.projects.length){s.projects=data.projects;s.templates=Array.isArray(data.templates)?data.templates:[];s.currentId=data.currentId}}}catch(e){storageAvailable=false}
s.currentId=s.projects.some(p=>p.id===s.currentId)?s.currentId:s.projects[0].id;
const p=()=>s.projects.find(x=>x.id===s.currentId)||s.projects[0];
const normalize=q=>{const base=blankProject();return {...base,...q,metrics:{...base.metrics,...q.metrics},stages:Array.isArray(q.stages)?Array.from({length:10},(_,i)=>!!q.stages[i]):base.stages,scenes:Array.isArray(q.scenes)?q.scenes:[],shots:Array.isArray(q.shots)?q.shots:[],broll:Array.isArray(q.broll)?q.broll:[],edits:Array.isArray(q.edits)?q.edits:[]}};
s.projects=s.projects.map(normalize);
function persist(){const q=p();q.updatedAt=now();if(q.finished&&!gate(q).ok)q.finished=false;try{localStorage.setItem(KEY,JSON.stringify({projects:s.projects,templates:s.templates,currentId:s.currentId}));storageAvailable=true}catch(e){storageAvailable=false}let el=document.getElementById('save-state');if(el)el.textContent=storageAvailable?'● Сохранено локально':'⚠ Только в текущем сеансе'}
function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),3100)}
function sec(tc){if(typeof tc==='number')return tc;let m=String(tc??'').trim().match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):NaN}
function tc(n){n=Math.max(0,Math.floor(Number(n)||0));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
const words=q=>txt(q).split(/\s+/).filter(Boolean).length;
function timesValid(q){const dur=Number(q.length);if(!Number.isFinite(dur)||dur<1||dur>90)return false;for(const row of [...q.scenes,...q.edits]){if(!Number.isFinite(sec(row.start))||!Number.isFinite(sec(row.end))||sec(row.start)<0||sec(row.end)>dur||sec(row.end)<=sec(row.start))return false}return true}
function gate(q){const checks=[{label:'Сценарий написан',detail:'Текст сценария не пустой',ok:!!txt(q.script)},{label:'Список кадров составлен',detail:'Есть хотя бы один описанный кадр',ok:q.shots.some(x=>!!txt(x.description))},{label:'Монтажный план составлен',detail:'Есть хотя бы одно монтажное действие',ok:q.edits.some(x=>!!txt(x.action))},{label:'Субтитры проверены',detail:'Проверены текст, синхронизация и читаемость',ok:!!q.subtitlesChecked},{label:'Хронометраж корректен',detail:'До 90 секунд, без ошибочных тайм-кодов',ok:timesValid(q)}];return {checks,ok:checks.every(c=>c.ok),count:checks.filter(c=>c.ok).length}}
function len(q){return Math.max(1,Math.min(90,Number(q.length)||45))}
function val(key){return esc(p()[key])}
function f(key,label,{type='text',hint='',placeholder='',rows=3,options=null}={}){let v=p()[key]??'';const attr=`data-prop="${key}"`;let input=options?`<select ${attr}>${options.map(x=>`<option value="${esc(x[0])}" ${v===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`:type==='textarea'?`<textarea ${attr} rows="${rows}" placeholder="${esc(placeholder)}">${esc(v)}</textarea>`:`<input ${attr} type="${type}" value="${esc(v)}" placeholder="${esc(placeholder)}" ${key==='length'?'min="1" max="90" step="1"':''}>`;return `<label class="field"><span>${esc(label)}</span>${input}${hint?`<small>${esc(hint)}</small>`:''}</label>`}
function metric(key,label,hint=''){return `<label class="field"><span>${esc(label)}</span><input type="number" step="any" min="0" data-metric="${esc(key)}" placeholder="0" value="${esc(p().metrics[key])}">${hint?`<small>${esc(hint)}</small>`:''}</label>`}
function head(title,subtitle,actions=''){return `<div class="intro"><div><div class="eyebrow">REELFLOW / ${esc(p().title)}</div><h1>${title}</h1><p>${subtitle}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`}
function card(title,body,subtitle='',extras=''){return `<section class="card"><div class="card-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${extras}</div>${body}</section>`}
const btn=(action,label,klass='btn sm',attrs='')=>`<button class="${klass}" type="button" data-action="${action}" ${attrs}>${label}</button>`;
const cardchecks=checks=>checks.map(c=>`<div class="checkline"><span class="tick ${c.ok?'ok':''}">${c.ok?'✓':'·'}</span><div><b>${esc(c.label)}</b><p>${esc(c.detail)}</p></div></div>`).join('');
function sidebar(){const q=p();return `<div class="brand"><div class="brand-icon">▶</div><div><div class="brand-name">REEL<span>FLOW</span></div><div class="brand-sub">КОНТЕНТ-СТУДИЯ</div></div></div><div class="sidebar-label">Рабочая студия</div>${navs.map(([v,title,ico])=>`<button class="nav ${s.view===v?'active':''}" data-view="${v}"><span class="ico">${ico}</span>${title}${v==='templates'?`<span class="count">${s.templates.length}</span>`:''}</button>`).join('')}<div class="sidebar-label">Недавние ролики</div>${s.projects.slice().reverse().slice(0,5).map(r=>`<div class="quick-project ${r.id===s.currentId?'active':''}" data-action="select-project" data-id="${r.id}" title="${esc(r.title)}"><span>▶ ${esc(r.title)}</span><small>${r.finished?'✓':'◌'}</small></div>`).join('')}<div style="margin:10px 6px">${btn('new-project','＋ Новый ролик','btn primary sm','style="width:100%"')}</div><div class="sidebar-foot"><b>Всё под контролем.</b><span id="save-state">${storageAvailable?'● Сохранено локально':'⚠ Только в текущем сеансе'}</span><div style="margin-top:8px;line-height:1.5">Данные остаются в этом браузере. Для резервной копии используйте JSON.</div></div>`}
function topbar(){return `<header class="topbar"><div class="cluster"><button class="btn sm mobile-menu" data-action="toggle-menu" aria-label="Открыть меню">☰</button><div class="crumb">Рабочее пространство <span style="color:#b7bdc9">/</span> ${esc(navs.find(n=>n[0]===s.view)?.[1]||'Пульт')}</div></div><div class="top-actions"><select class="top-select" id="project-select" aria-label="Текущий ролик">${s.projects.map(x=>`<option value="${x.id}" ${x.id===s.currentId?'selected':''}>${esc(x.title)}</option>`).join('')}</select>${btn('export','↓ JSON','btn sm')}${btn('new-project','+ Новый','btn primary sm')}</div></header>`}
function render(){document.getElementById('app').innerHTML=`<div class="menu-overlay" id="menu-overlay" data-action="toggle-menu"></div><div class="app"><aside class="sidebar" id="sidebar">${sidebar()}</aside><div class="main">${topbar()}<main class="content">${views[s.view]?.()||dashboard()}</main></div></div>`}
function dashboard(){const q=p(),g=gate(q),progress=q.stages.filter(Boolean).length,unfinished=q.stages.findIndex(v=>!v),resume=stages[unfinished<0?9:unfinished][1];return `${head('Пульт производства','Один ролик — один управляемый процесс. Продолжайте с любого этапа.',btn('copy-structure','⧉ Скопировать структуру'))}<div class="hero"><div><div class="eyebrow" style="color:#b6a9ff">ТЕКУЩИЙ ПРОЕКТ · ${esc(q.series)}</div><h1>${esc(q.title)}</h1><p>${txt(q.idea)?esc(q.idea):'Начните с идеи или исходного текста. Потом соберите сценарий, кадры и монтажный план.'}</p><div class="actions">${btn('navigate','Продолжить работу →','btn primary',`data-target="${resume}"`)}${btn('scaffold','✦ Собрать каркас','btn')}</div></div><div class="hero-right"><div class="hero-kpi"><strong>${progress}<span style="font-size:19px">/10</span></strong><span>этапов пройдено</span><div class="progress-track" style="margin-top:13px;background:#ffffff2c"><div style="width:${progress*10}%"></div></div></div></div></div><div class="grid cols4 stats" style="margin:16px 0"><div class="card stat"><div class="stat-symbol">◷</div><div><div class="num">${len(q)} с</div><div class="hint">лимит: 90 секунд</div></div></div><div class="card stat"><div class="stat-symbol">▤</div><div><div class="num">${q.scenes.length}</div><div class="hint">сцен в режиссёрской</div></div></div><div class="card stat"><div class="stat-symbol">▦</div><div><div class="num">${q.shots.filter(x=>x.done).length}/${q.shots.length}</div><div class="hint">кадров снято</div></div></div><div class="card stat"><div class="stat-symbol">✓</div><div><div class="num">${g.count}/5</div><div class="hint">критериев готовности</div></div></div></div><div class="subheading"><h2>Маршрут производства</h2><div class="pill purple">Идея → Аналитика</div></div><div class="pipeline">${stages.map(([title,v],i)=>`<div class="step ${q.stages[i]?'checked':''}"><div class="spaced"><span class="number">ЭТАП ${String(i+1).padStart(2,'0')}</span><span class="${q.stages[i]?'checkmark':''}">${q.stages[i]?'✓':'○'}</span></div><button class="step-title" style="text-align:left;border:0;background:none;padding:0" data-view="${v}" ${i===5?'data-shottab="broll"':''}>${esc(title)}</button><div class="step-foot"><button data-view="${v}" ${i===5?'data-shottab="broll"':''}>Открыть ↗</button><button data-action="toggle-stage" data-stage="${i}">${q.stages[i]?'Снять ✓':'Отметить ✓'}</button></div></div>`).join('')}</div><div class="grid cols2 section-space">${card('Контроль готовности',`${cardchecks(g.checks)}<div class="divider"></div><div class="spaced"><div><div class="pill ${g.ok?'green':'amber'}">${q.finished?'✓ Ролик завершён':g.ok?'Можно завершать':'Не готов к завершению'}</div></div>${btn('finish',q.finished?'Снять статус «Завершён»':'Завершить ролик',`btn ${q.finished?'':'primary'}`,g.ok||q.finished?'':'disabled')}</div>`,'Строгий выпускной чек-лист')}${card('Быстрый старт',`<div class="stack">${f('title','Название ролика')}${f('raw','Исходный текст или идея',{type:'textarea',rows:4,placeholder:'Вставьте текст, заметки, тезисы или расшифровку...'})}<div class="actions">${btn('scaffold','✦ Собрать каркас из текста','btn primary')}${btn('navigate','Все поля →','btn','data-target="strategy"')}</div><div class="note">«Собрать каркас» создаёт редактируемую заготовку из вашего текста — без обращения к нейросети и без выдумывания фактов.</div></div>`,'С текста до первого черновика')}</div>`}
function strategy(){const q=p();return `${head('Идея и стратегия','Зафиксируйте смысл, зрителя и формат прежде, чем писать сценарий.',btn('scaffold','✦ Собрать каркас','btn primary'))}<div class="grid cols2">${card('01 / Исходник',`<div class="stack">${f('title','Название ролика')}${f('idea','Идея в одном предложении',{type:'textarea',rows:2,placeholder:'О чём ролик и почему его хочется досмотреть?'})}${f('raw','Исходный текст / заметки',{type:'textarea',rows:9,placeholder:'Вставьте свой текст. Можно с хаосом, повторами и обрывками мыслей.'})}${f('references','Референсы и ссылки',{type:'textarea',rows:3,placeholder:'Ссылки, визуальные референсы, примеры монтажных решений'})}</div>`,'Ничего не потеряется: исходник остаётся отдельно от сценария')}${card('02 / Для кого и зачем',`<div class="stack">${f('goal','Цель ролика',{placeholder:'Охват, узнаваемость, подписки, переходы, продажи...'})}${f('audience','Целевая аудитория',{type:'textarea',rows:3,placeholder:'Кто этот зритель? Какой вопрос или боль у него есть?'})}${f('thesis','Главный тезис',{type:'textarea',rows:2,placeholder:'Что зритель должен понять или почувствовать?'})}${f('hook','Хук в первые 1–3 секунды',{type:'textarea',rows:2,placeholder:'С чего начинаем, чтобы зритель остановился?'})}${f('cta','Призыв к действию (если нужен)',{placeholder:'Сохранить, подписаться, перейти, высказать мнение...'})}</div>`,'Конкретный результат для зрителя')}</div><div class="grid cols2 section-space">${card('03 / Производственные ограничения',`<div class="grid cols2">${f('format','Формат',{options:[['faceless','Без лица'],['talking','Говорящая голова'],['hybrid','Гибридный']]})}${f('length','Целевая длительность, секунд',{type:'number',hint:'Максимум 90 секунд'})}${f('series','Контент-серия',{placeholder:'Например: 30 секунд о монтаже'})}${f('seriesNumber','Номер в серии',{type:'number'})}</div><div class="divider"></div><div class="stack">${f('minAnimation','Минимальная анимация',{type:'textarea',rows:2,placeholder:'Например: лёгкий зум + простой переход между иллюстрациями'})}${f('illustrations','Иллюстрации и визуальный стиль',{type:'textarea',rows:2,placeholder:'Стиль, изображения, пропорции 9:16, надписи'})}</div>`,'План для производства без сложной анимации')}${card('04 / Правила ролика',`<div class="stack"><div class="note"><b>Не более 90 секунд.</b> Длинный исходник сохраняется, но сценарий и тайм-коды должны уложиться в выбранную длительность.</div><div class="note"><b>Без лица?</b> Заменяйте говорящую голову иллюстрациями, предметными планами, скринкастами и B-roll.</div><div class="note"><b>Только нужная анимация.</b> Можно указать простые движения, появление текста и смену картинок — без 3D и тяжёлых эффектов.</div><div class="note"><b>Каналы.</b> Приоритет — VK Клипы; доступны Instagram Reels, YouTube Shorts и другие площадки.</div>${btn('navigate','Перейти к сценарию →','btn primary','data-target="script"')}</div>`,'Параметры можно менять на любом этапе')}</div>`}
function script(){const q=p(),approx=words([q.hook,q.script,q.cta].join(' ')),seconds=Math.round(approx/2.5),exceed=seconds>len(q);return `${head('Сценарий','Пишите для голоса и зрителя, а не для идеального документа.',btn('copy-text','⧉ Копировать сценарий'))}<div class="grid cols2"><div class="stack">${card('Сценарный документ',`<div class="stack">${f('hook','Хук / первая фраза',{type:'textarea',rows:2,placeholder:'Первый неожиданный поворот, вопрос, контраст...'})}<div class="bigtext">${f('script','Основной сценарий',{type:'textarea',rows:12,placeholder:'Текст озвучки или реплики по порядку. Одна мысль — один смысловой блок.'})}</div>${f('cta','Финал / CTA',{type:'textarea',rows:2,placeholder:'Чем заканчивается ролик?'})}<div class="actions">${btn('scaffold','✦ Собрать каркас','btn primary')}${btn('copy-text','Копировать текст','btn')}</div></div>`,'Исходный текст хранится в разделе «Идея и стратегия»')}${card('Смысловой каркас',`<div class="stack"><div class="note"><b>0–3 сек — Хук.</b> Парадокс, проблема или обещание.</div><div class="note"><b>3–15 сек — Контекст.</b> Почему это имеет значение?</div><div class="note"><b>15–75 сек — Развитие.</b> Доказательство, показ, пример или контраст.</div><div class="note"><b>Финал — Вывод.</b> Один ясный результат для зрителя.</div></div>`,'Структура — подсказка, а не жёсткий шаблон')}</div><div class="stack">${card('Тест хронометража',`<div class="grid cols2"><div><div class="eyebrow">Примерная озвучка</div><h1>${seconds} с</h1><small>${approx} слов ≈ 150 слов/мин</small></div><div><div class="eyebrow">Целевая длительность</div><h1>${len(q)} с</h1><small>Предел: 90 секунд</small></div></div><div class="divider"></div><div class="note ${exceed?'warn':'good'}">${exceed?'Текст может не уложиться в выбранную длительность. Сократите или ускорьте подачу.':'По ориентировочной скорости текст помещается в заданную длительность.'}</div><div class="vis-note">Оценка приблизительная: реальные паузы и темп речи меняют длительность.</div>`,'Отделите текст от пауз, эмоций и визуала')}${card('Превью вертикального ролика',`<div class="row"><div class="phone"><span class="phone-hook">${esc(q.hook||'ЗДЕСЬ ПОЯВИТСЯ ВАШ ХУК')}</span><span class="phone-caption">${esc(q.format==='faceless'?'ИЛЛЮСТРАЦИИ + ТЕКСТ':q.format==='talking'?'ГОВОРЯЩАЯ ГОЛОВА':'СМЕШАННЫЙ ФОРМАТ')}</span></div><div style="flex:1"><h3>Формат 9:16</h3><p class="muted" style="margin:8px 0">${q.format==='faceless'?'Картинки, визуальные метафоры, скринкасты и текст на экране':q.format==='talking'?'Основной акцент — человек в кадре, B-roll на усиление': 'Комбинируйте речь в кадре и визуальные вставки'}</p><div class="pill purple">До ${len(q)} сек</div></div></div>`,'Условная композиция для планирования')}${card('Озвучка и подача',`<div class="stack">${f('voice','Голос / интонация',{type:'textarea',rows:3,placeholder:'Ровно, с паузами, иронично, уверенно...'})}${f('minAnimation','Простая анимация',{type:'textarea',rows:2})}${btn('navigate','Разложить по сценам →','btn primary','data-target="director"')}</div>`,'Заранее продумайте звучание и ритм')}</div></div>`}
function tableText(collection,index,key,rows=2,placeholder=''){const v=p()[collection][index]?.[key]??'';return `<textarea data-collection="${collection}" data-index="${index}" data-field="${key}" rows="${rows}" placeholder="${esc(placeholder)}">${esc(v)}</textarea>`}
function tableInput(collection,index,key,cls='',type='text'){let v=p()[collection][index]?.[key]??'';return `<input class="${cls}" type="${type}" data-collection="${collection}" data-index="${index}" data-field="${key}" value="${esc(v)}">`}
function tableSelect(collection,index,key,opts){const v=p()[collection][index]?.[key];return `<select data-collection="${collection}" data-index="${index}" data-field="${key}">${opts.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
function timeWarnings(rows,dur){return rows.some(x=>!(sec(x.start)>=0&&sec(x.end)>sec(x.start)&&sec(x.end)<=dur))}
function director(){const q=p();return `${head('Режиссёрская таблица','Покадрово свяжите текст, изображение, титры, звук, локацию и время.',btn('add-scene','+ Добавить сцену','btn primary'))}<div class="spaced" style="margin-bottom:14px"><div class="pill purple">Длительность: ${len(q)} секунд · тайм-код ММ:СС</div>${btn('scaffold-scenes','✦ Создать сцены из сценария','btn sm')}</div>${timeWarnings(q.scenes,len(q))?'<div class="note warn" style="margin-bottom:12px">В таблице есть неверные тайм-коды: начало должно быть раньше конца, а конец — не позднее длительности ролика.</div>':''}<div class="card"><div class="card-head"><div><h2>Разбивка на сцены</h2><p>В каждой строке — один визуальный или смысловой фрагмент.</p></div><span class="pill gray">${q.scenes.length} сцен</span></div>${q.scenes.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Время от</th><th>Время до</th><th>Озвучка / речь</th><th>Что в кадре</th><th>Надпись</th><th>Звук / музыка</th><th>Локация</th><th></th></tr></thead><tbody>${q.scenes.map((x,i)=>`<tr><td>${tableInput('scenes',i,'start','narrow')}</td><td>${tableInput('scenes',i,'end','narrow')}</td><td>${tableText('scenes',i,'voice',3,'Реплика или смысл')}</td><td>${tableText('scenes',i,'visual',3,'Что зритель видит')}</td><td>${tableText('scenes',i,'onScreen',3,'Титры / надпись')}</td><td>${tableText('scenes',i,'audio',2,'Звуки, паузы')}</td><td>${tableInput('scenes',i,'location','medium')}</td><td><button class="trash" data-action="remove-row" data-collection="scenes" data-index="${i}" aria-label="Удалить сцену">×</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Пока нет сцен</strong>Добавьте сцену или создайте основу автоматически из сценария.</div>`}<div class="actions section-space">${btn('add-scene','+ Новая сцена','btn')}${btn('navigate','Перейти к списку кадров →','btn primary','data-target="shots"')}</div></div><div class="note section-space">Подсказка: визуалы можно менять независимо от озвучки. Это особенно удобно для формата без лица и минимальной анимации.</div>`}
function shots(){const q=p();return `${head('Список кадров и B-roll','Планируйте съёмку, иллюстрации и дополнительные вставки отдельно.',btn('navigate','План съёмки →','btn primary','data-target="shoot"'))}<div class="stage-bar"><button class="tab ${s.shotTab==='shots'?'active':''}" data-action="shot-tab" data-tab="shots">Список кадров · ${q.shots.length}</button><button class="tab ${s.shotTab==='broll'?'active':''}" data-action="shot-tab" data-tab="broll">B-roll · ${q.broll.length}</button></div>${s.shotTab==='shots'?shotTable(q):brollTable(q)}`}
function shotTable(q){return `${card('Кадры основной съёмки',`${q.shots.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Снято</th><th>Что снять</th><th>Локация</th><th>План</th><th>Оборудование</th><th>Примечание</th><th></th></tr></thead><tbody>${q.shots.map((x,i)=>`<tr><td style="text-align:center"><input type="checkbox" data-collection="shots" data-index="${i}" data-field="done" ${x.done?'checked':''} aria-label="Кадр снят"></td><td>${tableText('shots',i,'description',3,'Кадр / действие')}</td><td>${tableInput('shots',i,'location','medium')}</td><td>${tableSelect('shots',i,'size',['Крупный','Средний','Общий','Деталь','Скринкаст','Иллюстрация'])}</td><td>${tableInput('shots',i,'equipment','wide')}</td><td>${tableText('shots',i,'notes',2,'Свет, ракурс, движение')}</td><td><button class="trash" data-action="remove-row" data-collection="shots" data-index="${i}">×</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Нет кадров</strong>Добавьте кадры вручную либо соберите из сцен.</div>`}<div class="actions section-space">${btn('add-shot','+ Добавить кадр','btn primary')}${btn('scaffold-shots','✦ Кадры из сцен','btn')}${btn('copy-shots','⧉ Скопировать список','btn')}</div>`,'Вся съёмка — в одном списке')}<div class="note section-space">Кадры автоматически группируются по локациям во вкладке «Съёмка». Чекбоксы синхронизируются.</div>`}
function brollTable(q){return `${card('B-roll / иллюстрации / вставки',`${q.broll.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Готово</th><th>Вставка / визуал</th><th>Источник</th><th>Где взять / снять</th><th>Заметки</th><th></th></tr></thead><tbody>${q.broll.map((x,i)=>`<tr><td><input type="checkbox" data-collection="broll" data-index="${i}" data-field="done" ${x.done?'checked':''}></td><td>${tableText('broll',i,'description',3,'Пример: руки с предметом, скриншот, деталь')}</td><td>${tableSelect('broll',i,'source',['Снять','Архив','Сток','Иллюстрация','Скринкаст','Генерация'])}</td><td>${tableInput('broll',i,'location','medium')}</td><td>${tableText('broll',i,'notes',2,'Движение, ссылка, обработка')}</td><td><button class="trash" data-action="remove-row" data-collection="broll" data-index="${i}">×</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Дополнительных вставок пока нет</strong>B-roll помогает скрывать склейки, показывать детали и удерживать ритм.</div>`}<div class="actions section-space">${btn('add-broll','+ Добавить B-roll','btn primary')}${btn('scaffold-broll','✦ B-roll из сцен','btn')}</div>`,'Дополнительные планы, которые усиливают основную мысль')}<div class="note section-space">Если вы делаете ролик без лица, B-roll может быть основным видеорядом: иллюстрации, экранные записи, предметная съёмка и простое движение кадров.</div>`}
function shoot(){const q=p(),groups={};q.shots.forEach((x,i)=>{const key=txt(x.location)||'Локация не указана';(groups[key]??=[]).push({...x,i,kind:'shots'})});q.broll.filter(x=>x.source==='Снять').forEach((x,i)=>{const key=txt(x.location)||'B-roll / без локации';(groups[key]??=[]).push({...x,i:q.broll.indexOf(x),kind:'broll'})});let items=Object.entries(groups);return `${head('Съёмка по локациям','Снимайте все кадры в одной локации за один подход — без хаотичных переездов.',btn('copy-shoot','⧉ Скопировать план'))}<div class="grid cols2">${card('Параметры смены',`<div class="stack">${f('shootDate','Дата съёмки',{type:'date'})}${f('gear','Оборудование',{type:'textarea',rows:2})}${f('shootNotes','План дня / логистика',{type:'textarea',rows:4,placeholder:'Свет, порядок локаций, люди, доступ, ограничения'})}</div>`,'Доступно для правки в любой момент')}${card('Прогресс съёмки',`<div class="grid cols2"><div><div class="eyebrow">Всего к съёмке</div><h1>${q.shots.length+q.broll.filter(x=>x.source==='Снять').length}</h1></div><div><div class="eyebrow">Уже снято</div><h1>${q.shots.filter(x=>x.done).length+q.broll.filter(x=>x.source==='Снять'&&x.done).length}</h1></div></div><div class="divider"></div><p class="muted">Локаций: ${items.length}. Отметки сохраняются и обновляют список кадров.</p><div class="actions section-space">${btn('navigate','Изменить кадры →','btn','data-target="shots"')}</div>`,'Сначала снимите все необходимые исходники')}</div><div class="subheading"><h2>Маршрут по локациям</h2><span class="pill purple">${items.length} точек</span></div>${!items.length?`<div class="empty"><strong>Локаций пока нет</strong>Добавьте основные кадры в разделе «Кадры и B-roll».</div>`:items.map(([name,list])=>`<div class="shoot-location"><div class="location-head"><div><h3>◎ ${esc(name)}</h3><small>${list.filter(x=>x.done).length} / ${list.length} кадров готово</small></div><span class="pill ${list.every(x=>x.done)?'green':'gray'}">${list.every(x=>x.done)?'Готово':'В работе'}</span></div><div class="location-items">${list.map(x=>`<label class="location-item ${x.done?'done':''}"><input type="checkbox" data-collection="${x.kind}" data-index="${x.i}" data-field="done" ${x.done?'checked':''}><span class="shot-body"><h4>${esc(x.description||'Не описан кадр')}</h4><small>${esc(x.kind==='shots'?(x.size+' · '+(x.equipment||'Без оборудования')):('B-roll · '+x.source))}${x.notes?' · '+esc(x.notes):''}</small></span></label>`).join('')}</div></div>`).join('')}`}
function edit(){const q=p();return `${head('Монтажный план','Тайм-коды, склейки, музыка, субтитры и критерии финальной проверки.',btn('add-edit','+ Монтажный фрагмент','btn primary'))}<div class="grid cols2">${card('Звук и визуал',`<div class="stack">${f('music','Музыка / трек / источник',{placeholder:'Название, ссылка, лицензия или пометка «подобрать»'})}${f('musicMood','Ритм, громкость и звуковые акценты',{type:'textarea',rows:2,placeholder:'Темп, паузы, переходы под бит, сайдчейн'})}${f('illustrations','Иллюстрации и оформление',{type:'textarea',rows:2})}${f('minAnimation','Минимальная анимация',{type:'textarea',rows:2})}</div>`,'Не перегружайте ролик лишними эффектами')}${card('Субтитры',`<div class="stack">${f('subtitlesFile','Файл / источник субтитров',{placeholder:'Например: reels_01.srt или вручную в Premiere Pro'})}${f('subtitlesNotes','Правила и замечания',{type:'textarea',rows:2,placeholder:'Без опечаток, синхронно речи, безопасные зоны 9:16'})}<label class="check-toggle"><input type="checkbox" data-prop="subtitlesChecked" ${q.subtitlesChecked?'checked':''}>Я проверил текст, тайминги и читаемость субтитров</label><div class="note ${q.subtitlesChecked?'good':'warn'}">${q.subtitlesChecked?'Проверка субтитров отмечена.':'Этот пункт обязателен для статуса «Завершён».'}</div></div>`,'После изменения сценария отметка проверки сбрасывается')}</div><div class="subheading"><h2>Монтажная тайм-линия</h2><span class="pill purple">${q.edits.length} фрагментов · до ${len(q)} сек</span></div>${timeWarnings(q.edits,len(q))?'<div class="note warn" style="margin-bottom:13px">Исправьте тайм-коды монтажного плана, иначе ролик нельзя завершить.</div>':''}<div class="card">${q.edits.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Готово</th><th>Начало</th><th>Конец</th><th>Что происходит на монтаже</th><th>Музыка / звук</th><th>Титры и субтитры</th><th></th></tr></thead><tbody>${q.edits.map((x,i)=>`<tr><td><input type="checkbox" data-collection="edits" data-index="${i}" data-field="done" ${x.done?'checked':''}></td><td>${tableInput('edits',i,'start','narrow')}</td><td>${tableInput('edits',i,'end','narrow')}</td><td>${tableText('edits',i,'action',3,'Склейка, смена картинки, движение')}</td><td>${tableText('edits',i,'audio',2,'Где бит / пауза')}</td><td>${tableText('edits',i,'subtitles',2,'Что на экране')}</td><td><button class="trash" data-action="remove-row" data-collection="edits" data-index="${i}">×</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Монтажный план пуст</strong>Создайте монтажную основу из режиссёрских сцен.</div>`}<div class="actions section-space">${btn('add-edit','+ Добавить фрагмент','btn primary')}${btn('scaffold-edits','✦ Монтаж из сцен','btn')}${btn('copy-edit','⧉ Копировать план','btn')}</div></div><div class="grid cols2 section-space">${card('Финальная приёмка',`${cardchecks(gate(q).checks)}<div class="divider"></div><div class="spaced"><span class="pill ${gate(q).ok?'green':'amber'}">${gate(q).ok?'Можно завершать':'Не все условия выполнены'}</span>${btn('finish',q.finished?'Отменить завершение':'Завершить ролик','btn primary',gate(q).ok||q.finished?'':'disabled')}</div>`,'Статус не обойдёт обязательные проверки')}${card('Экспорт в рабочие программы',`<p class="muted" style="margin-bottom:15px">Скопируйте тайм-линию в монтажные заметки Premiere Pro, CapCut или другой NLE. Сами проекты и субтитры в программе не создаются.</p><div class="stack">${btn('copy-edit','⧉ Копировать монтажную таблицу','btn')}${btn('export','↓ Скачать проект и таблицы в JSON','btn')}</div>`,'Готовая структура для самостоятельного монтажа')}</div>`}
function publish(){const q=p(),g=gate(q);return `${head('Публикация и разбор','Не просто выкладывайте. Зафиксируйте гипотезу и результаты для следующей серии.',btn('finish',q.finished?'Снять завершение':'Завершить ролик',`btn ${g.ok?'primary':''}`,g.ok||q.finished?'':'disabled'))}<div class="grid cols2">${card('Публикация',`<div class="stack"><div class="pill ${g.ok?'green':'amber'}">${q.finished?'Завершён':g.ok?'К выпуску готов':'Есть блокирующие пункты'}</div>${f('platform','Основная площадка',{options:[['VK Клипы','VK Клипы'],['Instagram Reels','Instagram Reels'],['YouTube Shorts','YouTube Shorts'],['MAX','MAX'],['Другое','Другое']]})}${f('publishDate','Дата публикации',{type:'date'})}${f('cover','Идея обложки / текст',{type:'textarea',rows:2})}${f('caption','Описание публикации',{type:'textarea',rows:5,placeholder:'Короткий текст к ролику'})}${f('hashtags','Хештеги',{placeholder:'#тема #серия'})}${f('publishUrl','Ссылка на опубликованный ролик',{type:'url',placeholder:'https://...'})}<div class="actions">${btn('copy-post','⧉ Копировать пост','btn primary')}</div></div>`,'VK Клипы — по умолчанию, Telegram не используется')}${card('Условия выпуска',`${cardchecks(g.checks)}<div class="divider"></div><p class="hintline">Готовность не равна публикации: завершение проекта определяется обязательными материалами и проверками. Этап публикации отмечается отдельно в маршруте производства.</p>`,'Нельзя завершить без сценария, кадров, монтажа и субтитров')}</div><div class="subheading"><h2>Разбор результатов</h2><div class="pill gray">Метрики заполняются вручную</div></div><div class="card"><div class="grid cols4">${metric('views','Просмотры')}${metric('reach','Охват')}${metric('watch','Средний просмотр, сек')}${metric('retention','Досмотр, %')}${metric('saves','Сохранения')}${metric('shares','Репосты')}${metric('comments','Комментарии')}${metric('clicks','Переходы / заявки')}</div><div class="divider"></div><div class="grid cols2"><div>${f('takeaways','Что сработало / не сработало',{type:'textarea',rows:5,placeholder:'Хук, удержание, визуал, подача, длительность'})}</div><div>${f('nextHypothesis','Гипотеза для следующего ролика',{type:'textarea',rows:5,placeholder:'Что повторить или поменять в следующем выпуске'})}</div></div><div class="actions section-space">${btn('copy-structure','⧉ Следующий ролик по этой структуре','btn primary')}${btn('navigate','Открыть серию →','btn','data-target="series"')}</div></div>`}
function series(){const q=p();const grouped={};s.projects.forEach(r=>(grouped[r.series||'Без серии']??=[]).push(r));const keys=Object.keys(grouped).sort();return `${head('Контент-серия','Повторяемая структура, несколько выпусков и уроки от предыдущего ролика.',btn('copy-structure','+ Следующий выпуск','btn primary'))}<div class="grid cols2">${card('Текущая серия',`<div class="stack">${f('series','Название серии')}${f('seriesNumber','Номер выпуска',{type:'number'})}<div class="note">При создании следующего выпуска сохраняются формат, длительность, структура сцен, типы кадров, шаблон монтажа и визуальный стиль. Исходный текст и смысловые поля очищаются.</div><div class="actions">${btn('copy-structure','⧉ Копировать структуру','btn primary')}${btn('save-template','◇ Сохранить шаблон','btn')}</div></div>`,'Управляйте серийностью с помощью воспроизводимых форматов')}${card('Сводка серии',`<div class="grid cols2"><div><div class="eyebrow">Выпусков в серии</div><h1>${grouped[q.series]?.length||0}</h1></div><div><div class="eyebrow">Завершено</div><h1>${(grouped[q.series]||[]).filter(x=>x.finished).length}</h1></div></div><div class="divider"></div><div class="stack"><p class="muted">Серия собирается из роликов с одинаковым названием в поле «Контент-серия».</p><div class="pill purple">${esc(q.series)}</div></div>`,'Автоматическая группировка выпусков')}</div><div class="subheading"><h2>Все контент-серии</h2><span class="pill gray">${keys.length} серий</span></div><div class="grid cols2">${keys.map(key=>`<div class="card"><div class="card-head"><div><h3>${esc(key)}</h3><p>${grouped[key].length} роликов</p></div><span class="pill purple">Серия</span></div>${grouped[key].slice().sort((a,b)=>Number(a.seriesNumber)-Number(b.seriesNumber)).map(x=>`<div class="sequence"><div class="sequence-number">#${esc(x.seriesNumber||1)}</div><div class="sequence-info"><strong>${esc(x.title)}</strong><small>${x.finished?'Завершён':'В процессе'} · ${esc(x.format==='faceless'?'Без лица':x.format==='talking'?'Говорящая голова':'Гибрид')} · ${len(x)} сек</small></div><button class="btn sm" data-action="select-project" data-id="${x.id}">Открыть</button></div>`).join('')}</div>`).join('')}</div>`}
function templates(){return `${head('Шаблоны','Сохраните удачную структуру и используйте её сколько угодно раз.',btn('save-template','◇ Сохранить текущий','btn primary'))}${card('Библиотека шаблонов',`<div class="spaced" style="margin-bottom:15px"><label class="field" style="flex:1;max-width:420px"><span>Название нового шаблона</span><input id="template-name" placeholder="Например: без лица / 45 сек / тезис + B-roll" value="${esc(p().title)} — шаблон"></label>${btn('save-template','Сохранить как шаблон','btn primary')}</div>${s.templates.length?s.templates.map(t=>`<div class="template-card"><div><strong>◇ ${esc(t.name)}</strong><small>${esc(t.project.format==='faceless'?'Без лица':t.project.format==='talking'?'Говорящая голова':'Гибрид')} · ${len(t.project)} сек · ${t.project.scenes.length} сцен · ${t.project.shots.length} кадров</small></div><div class="actions">${btn('create-template','Создать ролик','btn primary sm',`data-id="${t.id}"`)}${btn('remove-template','Удалить','btn danger sm',`data-id="${t.id}"`)}</div></div>`).join(''):`<div class="empty"><strong>Пока нет шаблонов</strong>Сохраните структуру текущего ролика или создайте новый по предыдущему.</div>`}`,'В шаблон попадут только производственные настройки и структура')}<div class="grid cols2 section-space">${card('Копирование структуры',`<p class="muted" style="margin-bottom:14px">Создаётся новый чистый ролик. Сохраняются тайм-коды, формат, стиль анимации, локации и монтажные приёмы. Сценарий, снятые галочки, метрики и ссылки не копируются.</p>${btn('copy-structure','⧉ Новый ролик из текущего','btn primary')}`)}${card('Резервное копирование',`<p class="muted" style="margin-bottom:14px">Экспортируйте JSON с проектами и шаблонами. Его можно восстановить на другом устройстве. Файл содержит исходные тексты и рабочие данные — храните его приватно.</p><div class="actions">${btn('export','↓ Экспорт JSON','btn')}${btn('import','↑ Импорт JSON','btn')}</div>`,'Локальное хранение — не облачная синхронизация')}</div>`}
const views={dashboard,strategy,script,director,shots,shoot,edit,publish,series,templates};
function duplicateStructure(source){let z=blankProject();z.title='Новый выпуск · '+source.title;z.series=source.series;z.seriesNumber=(Number(source.seriesNumber)||1)+1;z.format=source.format;z.length=source.length;z.platform=source.platform;z.minAnimation=source.minAnimation;z.illustrations=source.illustrations;z.musicMood=source.musicMood;z.voice=source.voice;z.gear=source.gear;z.scenes=source.scenes.map(x=>({...x,id:id(),voice:'',visual:'',onScreen:'',audio:''}));z.shots=source.shots.map(x=>({...x,id:id(),description:'',done:false,notes:''}));z.broll=source.broll.map(x=>({...x,id:id(),description:'',done:false,notes:''}));z.edits=source.edits.map(x=>({...x,id:id(),action:'',audio:'',subtitles:'',done:false}));return z}
function addProject(z){s.projects.push(normalize(z));s.currentId=z.id;s.view='strategy';persist();render();toast('Новый ролик создан')}
function invalidateSubtitles(type,key){if((type==='prop'&&['script','hook','cta','length'].includes(key))||(type==='scenes'&&['voice','onScreen','start','end'].includes(key))||(type==='edits'&&['subtitles','start','end'].includes(key)))p().subtitlesChecked=false}
function setValue(el){let collection=el.dataset.collection,metricKey=el.dataset.metric,prop=el.dataset.prop;let value=el.type==='checkbox'?el.checked:el.value;if(el.type==='number'&&value!=='')value=Number(value);if(collection){let x=p()[collection]?.[Number(el.dataset.index)];if(!x)return;x[el.dataset.field]=value;invalidateSubtitles(collection,el.dataset.field)}else if(metricKey){p().metrics[metricKey]=value}else if(prop){if(prop==='length'){value=Math.max(1,Math.min(90,Number(value)||45));el.value=value}p()[prop]=value;invalidateSubtitles('prop',prop)}else return;persist()}
function toClip(text){if(!text){toast('Нет текста для копирования');return}if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Скопировано в буфер')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Скопировано')}catch{toast('Копирование недоступно в этом браузере')}ta.remove()}
function textual(kind){const q=p();if(kind==='copy-text')return [q.hook,q.script,q.cta].filter(txt).join('\n\n');if(kind==='copy-shots')return q.shots.map((x,i)=>`${i+1}. [${x.done?'✓':' '}] ${x.description}\nЛокация: ${x.location}; план: ${x.size}; оборудование: ${x.equipment}; заметки: ${x.notes}`).join('\n\n');if(kind==='copy-edit')return q.edits.map((x,i)=>`${i+1}. ${x.start}–${x.end} | ${x.action} | звук: ${x.audio} | субтитры: ${x.subtitles}`).join('\n');if(kind==='copy-shoot')return ['ПЛАН СЪЁМКИ',q.title,'Дата: '+q.shootDate,'Оборудование: '+q.gear,'Заметки: '+q.shootNotes,'',...q.shots.map((x,i)=>`${i+1}. [${x.done?'✓':' '}] ${x.location} | ${x.description} | ${x.size} | ${x.equipment}`)].join('\n');if(kind==='copy-post')return [q.caption,q.hashtags,q.publishUrl].filter(txt).join('\n\n');return ''}
function basicChunks(input){let paragraphs=String(input||'').split(/\n+/).map(txt).filter(Boolean);if(paragraphs.length<3){paragraphs=String(input||'').match(/[^.!?。！？]+[.!?。！？]?/g)?.map(txt).filter(Boolean)||[]}let chunks=[];for(let x of paragraphs){if(words(x)>32){let ps=x.split(/(?<=[.!?。！？])\s+/).filter(Boolean);if(ps.length>1){chunks.push(...ps);continue}}chunks.push(x)}return chunks.filter(Boolean).slice(0,12)}
function scaffoldScript(){const q=p();if(!txt(q.raw)&&!txt(q.idea)&&!txt(q.script)&&!txt(q.thesis)){toast('Сначала добавьте исходный текст или идею');return false}if(!txt(q.hook)){let phrase=basicChunks(q.raw||q.idea||q.thesis)[0]||'';q.hook=phrase.slice(0,175)}if(!txt(q.script))q.script=txt(q.raw||q.idea||q.thesis);if(!txt(q.thesis))q.thesis=txt(q.idea||q.script.split(/[.!?]/)[0]);return true}
function scaffoldScenes(force=false){const q=p();if(q.scenes.length&&!force){toast('Сцены уже есть — новый каркас не заменил их');return false}const initialChunks=basicChunks(q.script||q.raw||q.idea);if(!initialChunks.length){toast('Нужен сценарий или исходный текст');return false}const total=Math.min(len(q),90),cap=Math.max(1,Math.min(initialChunks.length,total)),chunks=initialChunks.length>cap?[...initialChunks.slice(0,cap-1),initialChunks.slice(cap-1).join(' ')]:initialChunks,weights=chunks.map(c=>Math.max(1,words(c))),sum=weights.reduce((a,b)=>a+b,0);let cursor=0;q.scenes=chunks.map((line,i)=>{let end=i===chunks.length-1?total:Math.min(total-(chunks.length-i-1),Math.max(cursor+1,Math.round(total*weights.slice(0,i+1).reduce((a,b)=>a+b,0)/sum)));let z={id:id(),start:tc(cursor),end:tc(end),voice:line,visual:'',onScreen:'',location:q.format==='faceless'?'Иллюстрации / материалы':'Дом / студия',audio:'',type:'Основной'};cursor=end;return z});return true}
function scaffoldShots(){const q=p();if(q.shots.length){toast('Список кадров уже заполнен — он сохранён');return false}if(!q.scenes.length&&!scaffoldScenes())return false;q.shots=q.scenes.map((x,i)=>({...newShot(),description:q.format==='faceless'?`Визуал к сцене ${i+1}: ${x.visual||'подобрать иллюстрацию / предметный кадр'}`:q.format==='talking'?`Говорящая голова, сцена ${i+1}: ${x.voice.slice(0,75)}`:`Сцена ${i+1}: ${x.visual||'снять фрагмент под реплику'}`,location:x.location||'Дом / студия',size:q.format==='faceless'?'Иллюстрация':'Средний',scene:x.id}));return true}
function scaffoldBroll(){const q=p();if(q.broll.length){toast('B-roll уже составлен');return false}if(!q.scenes.length&&!scaffoldScenes())return false;q.broll=q.scenes.map((x,i)=>({...newBroll(),description:`Вставка к сцене ${i+1}: ${x.visual||'подобрать кадр по смыслу реплики'}`,source:q.format==='faceless'?'Иллюстрация':'Снять',location:x.location,notes:'Простой зум / появление по необходимости'}));return true}
function scaffoldEdits(){const q=p();if(q.edits.length){toast('Монтажный план уже существует');return false}if(!q.scenes.length&&!scaffoldScenes())return false;q.edits=q.scenes.map((x,i)=>({...newEdit(),start:x.start,end:x.end,action:`Сцена ${i+1}: ${x.visual||'смена плана по смыслу'}`,audio:x.audio,subtitles:x.onScreen}));return true}
function scaffoldAll(){if(!scaffoldScript())return;let a=scaffoldScenes(),b=scaffoldShots(),c=scaffoldBroll(),d=scaffoldEdits();persist();render();toast('Каркас готов. Проверьте и отредактируйте каждый этап.')}
function doAction(el){const name=el.dataset.action;let q=p(),i=Number(el.dataset.index),col=el.dataset.collection;switch(name){case 'toggle-menu':document.getElementById('sidebar').classList.toggle('mobile-open');document.getElementById('menu-overlay').classList.toggle('active');return;case 'navigate':s.view=el.dataset.target;if(el.dataset.shottab)s.shotTab=el.dataset.shottab;break;case 'new-project':addProject(blankProject());return;case 'select-project':s.currentId=el.dataset.id;s.view='dashboard';break;case 'copy-structure':addProject(duplicateStructure(q));return;case 'toggle-stage':{let step=Number(el.dataset.stage);q.stages[step]=!q.stages[step];break}case 'finish':{if(q.finished){q.finished=false;toast('Статус завершения снят')}else if(gate(q).ok){q.finished=true;toast('Ролик отмечен завершённым')}else{toast('Не все критерии готовности выполнены');return}break}case 'scaffold':scaffoldAll();return;case 'scaffold-scenes':if(scaffoldScenes()){toast('Сцены созданы');}break;case 'scaffold-shots':if(scaffoldShots())toast('Кадры созданы');break;case 'scaffold-broll':if(scaffoldBroll())toast('B-roll создан');break;case 'scaffold-edits':if(scaffoldEdits())toast('Монтажный план создан');break;case 'add-scene':q.scenes.push(newScene());break;case 'add-shot':q.shots.push(newShot());break;case 'add-broll':q.broll.push(newBroll());break;case 'add-edit':q.edits.push(newEdit());break;case 'remove-row':if(q[col]&&q[col][i])q[col].splice(i,1);break;case 'shot-tab':s.shotTab=el.dataset.tab;break;case 'copy-text':case 'copy-shots':case 'copy-edit':case 'copy-shoot':case 'copy-post':toClip(textual(name));return;case 'export':{const exportData={app:'REELFLOW',version:1,exportedAt:now(),projects:s.projects,templates:s.templates,currentId:s.currentId};const blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='reelflow-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('JSON скачан');return}case 'import':document.getElementById('import-file').click();return;case 'save-template':{const field=document.getElementById('template-name');const name=txt(field?.value)||q.title+' — шаблон';s.templates.push({id:id(),name,project:duplicateStructure(q),createdAt:now()});toast('Шаблон сохранён');break}case 'create-template':{const t=s.templates.find(z=>z.id===el.dataset.id);if(t){const fresh=normalize(structuredClone(t.project));fresh.id=id();fresh.title=t.name.replace(/ — шаблон$/,'');fresh.seriesNumber=1;addProject(fresh)}return}case 'remove-template':s.templates=s.templates.filter(t=>t.id!==el.dataset.id);toast('Шаблон удалён');break;default:return}persist();render()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){s.view=nav.dataset.view;if(nav.dataset.shottab)s.shotTab=nav.dataset.shottab;render();return}const action=e.target.closest('[data-action]');if(action)doAction(action)});
document.addEventListener('input',e=>{if(e.target.matches('[data-prop], [data-collection], [data-metric]')){setValue(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='project-select'){s.currentId=e.target.value;persist();render();return}if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const data=JSON.parse(fr.result);if(!Array.isArray(data.projects)||!data.projects.length)throw Error('Некорректный файл');s.projects=data.projects.map(normalize);s.templates=Array.isArray(data.templates)?data.templates:[];s.currentId=s.projects.some(x=>x.id===data.currentId)?data.currentId:s.projects[0].id;s.view='dashboard';persist();render();toast('Проекты и шаблоны восстановлены')}catch(e){toast('Не удалось импортировать JSON: '+e.message)}};fr.readAsText(file);e.target.value='';return}if(e.target.matches('[data-prop], [data-collection], [data-metric]')){setValue(e.target);render()}});
render();
})();
